name: Copertina fedele gratuita

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vinted-cover
  cancel-in-progress: false

jobs:
  cover:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cover-requirements.txt
      - run: python -m pip install -r cover-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_cover*.py'
      - run: python cover_runner.py
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          GITHUB_REPOSITORY_VISIBILITY: public
          OMP_NUM_THREADS: '2'
          NUMBA_NUM_THREADS: '2'
          U2NET_HOME: ${{ runner.temp }}/cover-models
